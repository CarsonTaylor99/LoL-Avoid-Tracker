[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "lol-avoid-tracker"
version = "1.0.0"
description = "League of Legends companion tool that tracks rival and premade player activity in real time"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28.0",
    "pywebview>=4.0.0",
]

